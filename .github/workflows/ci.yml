name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  cache:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        rust: ['1.85.0', stable]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo run --locked --release --example experiment
  real-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.85.0'
      - run: cargo build --locked --release
      - name: Verify recorded artifact bytes from the checkout
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('docs/benchmarks/real-model')
          manifest = json.loads((root / 'manifest.json').read_text())
          for name, expected in manifest['artifact_sha256'].items():
              assert hashlib.sha256((root / name).read_bytes()).hexdigest() == expected, name
          print('Verified', len(manifest['artifact_sha256']), 'recorded artifact hashes')
          PY
      - name: Install isolated CPU dependencies
        run: |
          python3 -m venv .ci-venv
          .ci-venv/bin/python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          .ci-venv/bin/python -m pip install numpy==1.26.4 psutil==6.1.1 sentencepiece==0.2.0
      - name: Fetch checksum-pinned tiny public model
        run: .ci-venv/bin/python python/download_model.py
      - run: .ci-venv/bin/python -m unittest discover -s python -p test_serving.py -v
      - run: .ci-venv/bin/python python/demo.py
